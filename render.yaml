services:
  - type: web
    name: rasec-espetinhos
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: TZ
        value: America/Sao_Paulo
      - key: COOKIE_SECURE
        value: "1"
      - key: FIRESTORE_COLLECTION
        value: rasec
      - key: SEED_PASSWORD
        sync: false
      - key: FIRESTORE_SERVICE_ACCOUNT_BASE64
        sync: false
